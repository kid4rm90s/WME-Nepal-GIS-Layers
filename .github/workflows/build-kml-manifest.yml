name: Build KML manifests and outlines

on:
  push:
    branches: [Main]
    paths:
      - 'KML_Wards/**'
      - 'KML_Province/**'
      - 'Nepal_Intl_Boundary/**'
      - 'tools/build-kml-manifest.mjs'
      - 'tools/build-kml-outlines.mjs'
      - '.github/workflows/build-kml-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kml-manifest
  cancel-in-progress: true

jobs:
  build:
    # Guard: the commit-back push below also matches the source paths — don't re-trigger.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate ward manifests
        run: node tools/build-kml-manifest.mjs

      - name: Generate parent outlines
        run: node tools/build-kml-outlines.mjs

      - name: Verify generators are idempotent
        run: |
          node tools/build-kml-manifest.mjs --check
          node tools/build-kml-outlines.mjs --check

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add KML_Wards outlines
            git commit -m "chore: rebuild KML ward manifests and parent outlines"
            git push
          else
            echo "Manifests and outlines already up to date."
          fi
